    sha256: 83a170f428b33c1263f7cf17d75bc14cd1e389bf13f72938fc95f0084cc3abdd
    provenance_level: B
    candidate_content:
      - AWS enumeration outputs
      - Azure enumeration outputs
      - GCP enumeration outputs
      - tool schemas for Agent actions
    inclusion_status: approved_as_tool_and_observation_source
    notes: Use as a real tool adapter and baseline, not as attack ground truth by itself.

  - source_id: cross_cloud_observability_2026
    name: Measuring Attack Observability in Cloud Telemetry Logs
    upstream_url: https://doi.org/10.5281/zenodo.19933893
    source_type: cross_cloud_attack_telemetry
    license: CC-BY-4.0
    version_or_commit: record-19933893-v2
    retrieved_at: "2026-07-26T23:59:00+08:00"
    sha256: f75046f8660e28df60027e043c15d420c469a969c01784f045a4bd7354215db0
    sha256_scope: aws_logs_redacted.zip; all six artifact hashes are frozen in acquisition_manifest.json
    provenance_level: B
    candidate_content:
      - redacted AWS attack telemetry
      - redacted Azure attack telemetry
      - redacted GCP attack telemetry
      - original attack scripts
      - cross-platform log analysis
      - ten replicated GCP scheduled-transfer runs with explicit code-7 storage.objects.list denials and same-target success controls
      - 58 strict successful-data-operation candidate groups across 17 conservatively clustered attack-family lineages after collapsing with-webapp variants
      - 514 GCP provider-error events (code 5/7) excluded from positive support rather than treated as success
      - 20 reviewable provider-runtime path groups across 14 conservative lineages; 10 contain a list-then-read multi-operation chain
    inclusion_status: approved_for_acquisition
    notes: DOI-versioned, author-published lab telemetry across AWS, Azure, and GCP; do not describe it as production incident data. The scheduled-transfer blocked-path case is integrated into provider-oracle protocols v3/v4. The 20 path groups remain label-empty semantic-review candidates, not human gold; repeated runs and with-webapp variants never increase the independent sample count.

  - source_id: cloud_incident_reports_2016_2024
    name: Cloud Incident Reports (2016-2024)
    upstream_url: https://doi.org/10.5281/zenodo.14010282
    source_type: production_reliability_incident_reports
    license: CC-BY-4.0
    version_or_commit: record-14010282-v1
    retrieved_at: "2026-07-27T01:12:53+08:00"
    sha256: 31b4ff81f78252b6c027019fbd4c1c625ba0c0b9097395216559f64930c5ddbe
    sha256_scope: data.zip; upstream MD5 is frozen in acquisition_manifest.json
    provenance_level: B
    candidate_content:
      - 774 AWS production reliability incident reports
      - 127 Azure production reliability incident reports
      - 2186 GCP production reliability incident reports
      - 460 author-published human annotations
    inclusion_status: approved_as_external_negative_control_candidate
    notes: Real provider incident reports mirrored in a DOI dataset. They are not attack telemetry and must never be used as positive attack-path gold; use only to audit false-positive attack-path hallucination after human screening.

  - source_id: sigmahq_cloud_rules
    name: SigmaHQ Cloud Detection Rules
    upstream_url: https://github.com/SigmaHQ/sigma
    source_type: community_reviewed_detection_rules
    license: Detection Rule License 1.1
