    sha256: ccd24e4f41dfa85f8345fa8f132a6a917811ac05d9350a45f77f8be3500dea2a
    provenance_level: C
    candidate_content:
      - frozen Azure Terraform
      - official attack and defence manuals
      - SSRF to Cosmos DB and Blob Storage credentials
      - paired production-denied and development-public Blob containers
    inclusion_status: acquired_pending_native_validation
    notes: The production/development storage pair is a strong negative/positive control candidate. It remains C-level until Azure-native analysis and authorized data-plane probes are preserved.

  - source_id: gcpgoat
    name: GCPGoat
    upstream_url: https://github.com/ine-labs/GCPGoat
    source_type: executable_cloud_lab
    license: MIT
    version_or_commit: 44605c4bff4b2da7611dfce78696bb53db6d8c54
    retrieved_at: "2026-07-27T09:09:05+08:00"
    sha256: f8e59451cdf074144cac7fe97f87477296ca88a6c9a605eab72baf82dff85af8
    provenance_level: C
    candidate_content:
