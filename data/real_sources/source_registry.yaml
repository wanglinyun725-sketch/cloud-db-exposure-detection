registry_version: "0.1"
policy:
  main_dataset_allows_generated_cases: false
  raw_artifacts_are_immutable: true
  required_fields:
    - source_id
    - upstream_url
    - source_type
    - license
    - version_or_commit
    - retrieved_at
    - sha256
    - provenance_level
    - inclusion_status

sources:
  - source_id: mitre_attack_stix
    name: MITRE ATT&CK STIX 2.1
    upstream_url: https://github.com/mitre-attack/attack-stix-data
    source_type: threat_intelligence
    license: MITRE ATT&CK research-development-commercial license with attribution
    version_or_commit: a6c366439edee3a87b79cf90dc0b93f5d7975956
    retrieved_at: "2026-07-26T23:36:23+08:00"
    sha256: bdf1ce86a4e604214c5076d37ae4dcb322678afc528df8492e6fdc1b554f5da3
    provenance_level: A
    candidate_content:
      - cloud-related procedure examples
      - relationships
      - citations
      - data sources
    inclusion_status: approved_for_acquisition
    notes: Procedure text must retain ATT&CK object ID and original citation.

  - source_id: splunk_attack_data
    name: Splunk Attack Data
    upstream_url: https://github.com/splunk/attack_data
    source_type: attack_telemetry
    license: Apache-2.0
    version_or_commit: 3821bdb77c66c95b4e529f62a9d00b168446d1a8
    retrieved_at: "2026-07-26T23:36:23+08:00"
    sha256: a492566af61e4e0ba579cc82b4ce578d11566babe179254537b87980651e651e
    provenance_level: A_or_B
    candidate_content:
      - AWS CloudTrail datasets
      - attack metadata YAML
      - MITRE ATT&CK mappings
    inclusion_status: approved_for_selective_acquisition
    notes: Select only cloud/IAM/database-relevant subsets; repository is larger than 9 GB.

  - source_id: splunk_attack_data_2026_expansion
    name: Splunk Attack Data IAM enumeration expansion
    upstream_url: https://github.com/splunk/attack_data/tree/67fe973a954cc35688ad9b4906ed6e85af5892e9/datasets/attack_techniques/T1580/aws_iam_excessive_list_command_usage
    source_type: attack_telemetry
    license: Apache-2.0
    version_or_commit: 67fe973a954cc35688ad9b4906ed6e85af5892e9
    retrieved_at: "2026-07-28T00:00:00+08:00"
    sha256: d0e597bf34919e87ff53d757766a71431847d8788ca80ffe78d8ac23bb498f35
    provenance_level: B
    candidate_content:
      - AWS CloudTrail attack-range telemetry
      - explicit AccessDenied enumeration events
      - same-account and same-region successful control calls by a different IAM user
      - a second independent AccessDenied discovery-sweep dataset covering Secrets Manager, RDS, Redshift, DynamoDB, and SSM catalogue operations
    inclusion_status: approved_for_negative_certificate_audit
    notes: The YAML catalogues were generated by the upstream repository, but the admitted observations are recorded CloudTrail events, not generated benchmark samples or labels. The two T1580 directories are kept as separate independence groups and share no account ID.

  - source_id: cloudgoat
    name: CloudGoat
    upstream_url: https://github.com/RhinoSecurityLabs/cloudgoat
    source_type: executable_cloud_lab
    license: BSD-3-Clause
    version_or_commit: abf1ba8f5e47d7ced750fdfa025d51c99f1a43ed
    retrieved_at: "2026-07-26T23:36:23+08:00"
    sha256: 6e93d9311b2497de5219fe388be6d16e2209c6b44c9457c9fc044c25f32a75cc
    provenance_level: B_or_C
    candidate_content:
      - scenario Terraform
      - official scenario documentation
      - official walkthroughs
      - live CloudTrail collected in an isolated account
    inclusion_status: approved_for_acquisition
    notes: C-level until executed; B-level only after collecting real cloud observations.

  - source_id: cloudfoxable
    name: CloudFoxable
    upstream_url: https://github.com/BishopFox/cloudfoxable
    source_type: executable_cloud_lab
    license: MIT
    version_or_commit: fc49b7f637268031515ced9fee4b643d3e68db67
    retrieved_at: "2026-07-26T23:36:23+08:00"
    sha256: bec9436f0e8759601dd7669c108c0921db5b10bc2d941223f0467efb5227fe6d
    provenance_level: B_or_C
    candidate_content:
      - Terraform challenges
      - documented attack paths
      - CloudFox observations
      - live CloudTrail collected in an isolated account
    inclusion_status: approved_for_acquisition
    notes: Contains 18 public challenges; do not deploy in production/shared accounts.

  - source_id: stratus_red_team
    name: Stratus Red Team
    upstream_url: https://github.com/DataDog/stratus-red-team
    source_type: executable_attack_emulation
    license: Apache-2.0
    version_or_commit: 52db2f8bbbc85ca7c4292f0035180fc4fa8bfdb0
    retrieved_at: "2026-07-26T23:36:23+08:00"
    sha256: fa2ad67871887a55f226f875a9c339b7e12987b83aa5a951631ce9f5036d0480
    provenance_level: B_or_C
    candidate_content:
      - attack technique definitions
      - Terraform prerequisites
      - detonation actions
      - 35 published anonymized AWS CloudTrail detonation logs (310 events)
    inclusion_status: approved_for_acquisition
    notes: The 11 cloud-data-routed techniques with matching published logs are B-level runtime candidates; the other technique documents remain C-level candidates. The other 24 detonation logs are indexed but are not automatically labeled as cloud-data paths. Execute new detonations only in an isolated sandbox account and always verify cleanup.

  - source_id: otrf_security_datasets
    name: OTRF Security Datasets
    upstream_url: https://github.com/OTRF/Security-Datasets
