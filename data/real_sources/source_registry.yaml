      - Azure operation detection selections
      - GCP audit method detection selections
    inclusion_status: approved_as_external_agent_prior
    notes: Used only to derive an unweighted operation-rule support count. Filter/exclusion blocks and human gold are never used; this source is not path ground truth.

  - source_id: awsgoat
    name: AWSGoat
    upstream_url: https://github.com/ine-labs/AWSGoat
    source_type: executable_cloud_lab
    license: MIT
    version_or_commit: b24869ad455ed8d1393d00ecdc15ee638d1c1332
    retrieved_at: "2026-07-27T09:09:05+08:00"
    sha256: 5f79c2b8dfbd2993ee69454bc5707a293ee6b17f22337a94c05b48ae33793a70
    provenance_level: C
    candidate_content:
      - frozen Terraform for two AWS lab modules
      - official attack and defence manuals
      - SSRF to Lambda credentials and DynamoDB access
      - ECS task credentials to Secrets Manager and RDS credentials
    inclusion_status: acquired_pending_native_validation
    notes: The official walkthrough supplies hypotheses, not gold. Promote individual edges only after complete-scope AWS analysis; promote to runtime gold only after authorized probes and matching audit records.

  - source_id: azuregoat
    name: AzureGoat
    upstream_url: https://github.com/ine-labs/AzureGoat
