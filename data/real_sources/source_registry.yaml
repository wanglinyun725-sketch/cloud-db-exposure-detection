      - official attack and defence manuals
      - anonymous bucket IAM-policy escalation
      - explicit denied-before and allowed-after object-list transition
    inclusion_status: acquired_pending_native_validation
    notes: Policy Analyzer alone is insufficient for runtime gold. Preserve pre/post IAM states, testIamPermissions, the explicit denied probe, the policy-change audit event, and the successful post-change probe.

  - source_id: iam_vulnerable
