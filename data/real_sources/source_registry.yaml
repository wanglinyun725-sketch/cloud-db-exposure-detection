    sha256: 83cc349afa5672ae46fc38a824946b470f2f3fa39f22889b59dce9fda43fe74d
    provenance_level: B
    candidate_content:
      - CloudGoat cloud_breach_s3-derived AWS attack-emulation metadata
      - 103 published CloudTrail events with benign execution context
      - EC2 instance-role abuse and S3 listing/object-access operations
    inclusion_status: approved_for_expanded_pool_v0_3
    notes: This is an independently published telemetry capture but not an independent attack scenario; preserve the CloudGoat cloud_breach_s3 lineage group. It is attached only in expanded pool v0.3 and is not counted in the frozen v2 pilot.

  - source_id: cloudfox
